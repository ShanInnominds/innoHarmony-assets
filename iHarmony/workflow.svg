<g filter="url(#shadow)"><rect x="41" y="70" width="262" height="150" rx="16" fill="#FFFFFF" stroke="#E4E6EC"/></g><circle cx="81" cy="112" r="20" fill="url(#brand)"/><text x="81" y="119" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">1</text><text x="113" y="120" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#151C47">Write</text><text x="65" y="166" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#5F6368">pytest tests with page</text><text x="65" y="190" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#5F6368">and screen objects</text><path d="M313 145.0 h28" stroke="#E34D25" stroke-width="3" stroke-linecap="round"/><path d="M335 138.0 l9 7 l-9 7" fill="none" stroke="#E34D25" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="353" y="70" width="262" height="150" rx="16" fill="#FFFFFF" stroke="#E4E6EC"/></g><circle cx="393" cy="112" r="20" fill="url(#brand)"/><text x="393" y="119" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">2</text><text x="425" y="120" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#151C47">Configure</text><text x="377" y="166" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#5F6368">YAML per environment,</text><text x="377" y="190" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#5F6368">project and org policy</text><path d="M625 145.0 h28" stroke="#E34D25" stroke-width="3" stroke-linecap="round"/><path d="M647 138.0 l9 7 l-9 7" fill="none" stroke="#E34D25" stroke-width="3" stroke-linecap="round" stroke-linejoin="roun