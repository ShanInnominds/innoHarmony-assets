<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
html,body{height:500px;background:#f4f4f8}
.wrap{padding:66px 70px 0}
.kicker{text-align:center;color:#e4502a;font-weight:700;letter-spacing:8px;font-size:30px;margin-bottom:56px}
.row{display:flex;align-items:center;justify-content:center;gap:14px}
.card{background:#fff;border-radius:26px;box-shadow:0 10px 30px rgba(20,24,90,.08);width:290px;height:250px;padding:30px 26px;display:flex;flex-direction:column;gap:20px}
.card .badge{width:64px;height:64px;font-size:28px}
.card b{font-size:33px;line-height:1.15;color:var(--ink)}
.card.last{background:linear-gradient(135deg,#e4502a,#f0a830)}
.card.last b{color:#fff}.card.last .badge{background:#fff;color:#e4502a}
.arr{color:#e4502a;font-size:44px;font-weight:700}
</style></head><body><div class="wrap">
<div class="kicker">THE TRUVELOCITY QE FLOW</div>
<div class="row">
  <div class="card"><div class="badge">1</div><b>Requirements</b></div><div class="arr">→</div>
  <div class="card"><div class="badge">2</div><b>Risk analysis</b></div><div class="arr">→</div>
  <div class="card"><div class="badge">3</div><b>Test design</b></div><div class="arr">→</div>
  <div class="card"><div class="badge">4</div><b>Automation</b></div><div class="arr">→</div>
  <div class="card"><div class="badge">5</div><b>Execution</b></div><div class="arr">→</div>
  <div class="card"><div class="badge">6</div><b>Quality intelligence</b></div><div class="arr">→</div>
  <div class="card last"><div class="badge">7</div><b>Release decision</b></div>
</div></div></body></html>
